name: Update job list

on:
  schedule:
    # Every day at 05:00 UTC = 4pm Melbourne (AEDT) / 3pm (AEST).
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths: ["config/**"]      # re-run straight away when a role or company is added
  workflow_dispatch: {}       # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Run pipeline
        run: python -m job_radar run

      - name: Commit results
        run: |
          git config user.name  "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ data/seen.json README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update job list $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: Summary
        if: always()
        run: |
          [ -f output/new_this_week.md ] && cat output/new_this_week.md >> "$GITHUB_STEP_SUMMARY" || true

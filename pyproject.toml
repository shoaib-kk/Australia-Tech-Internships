[project]
name = "job-radar"
version = "1.1.0"
description = "Daily list of tech internships, vacationer programs and graduate roles in Australia, read from public company job boards."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
